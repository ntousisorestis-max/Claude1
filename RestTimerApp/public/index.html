<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Two, so the browser chrome matches the page before any JS has run.
         The app's own saved choice can override the palette a moment later;
         these are the best guess available until then. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0F0B1A"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F6F4FB"
    />
    <!-- Generated by `npm run icons` from assets/logo.png. -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Liftlock</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      /* The page behind the app, painted before the bundle loads. Without
         this a light-mode user gets a near-black flash on every launch.
         Must match `ink` in src/theme/palettes.ts. */
      body {
        background: #f6f4fb;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f0b1a;
        }
      }
      /* react-native-web renders into this; the app owns everything inside. */
      #root {
        display: flex;
      }
      #root > div {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
